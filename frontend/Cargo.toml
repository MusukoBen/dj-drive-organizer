[package]
name = "dj_drive_organizer_frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
log = "0.4"
wasm-logger = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
anyhow = "1.0"
js-sys = "0.3"
gloo-events = "0.2"
chrono = { version = "0.4", features = ["wasm-bindgen"] }
