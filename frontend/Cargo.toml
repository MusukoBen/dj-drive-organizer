[package]
name = "dj_drive_organizer_frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
log = "0.4"
wasm-logger = "0.2"
