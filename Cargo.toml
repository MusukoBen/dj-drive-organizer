[workspace]
members = ["src-tauri", "frontend"]
default-members = ["frontend"]
resolver = "2"

[package]
name = "dj_drive_organizer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dj_drive_organizer_bin"
path = "src/main.rs"

[dependencies]
dj_drive_organizer_frontend = { path = "frontend" }
yew          = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys      = { version = "0.3", features = ["Window", "Document", "File", "HtmlInputElement", "Event", "console"] }
js-sys       = "0.3"
gloo-events  = "0.2"
console_error_panic_hook = "0.1"
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
serde-wasm-bindgen = "0.5"
anyhow            = "1.0"
