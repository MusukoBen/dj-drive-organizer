[workspace]
members = ["src-tauri"]
resolver = "2"

[package]
name = "dj_drive_organizer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dj_drive_organizer_bin"
path = "src/main.rs"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
